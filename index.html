<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liroy Estudio de Idiomas — Plataforma Principal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #071936;
      --bg-gradient: radial-gradient(circle at top right, #0e2d5c, #040d1c);
      --card-bg: rgba(255, 255, 255, 0.05);
      --primary: #d91e36;
      --glow: rgba(217, 30, 54, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: var(--bg-gradient);
      color: #f8fafc;
      min-height: 100vh;
      transition: background-color 1.5s ease, color 1s ease;
      overflow-x: hidden;
    }

    /* BARRA SUPERIOR DE OFERTA */
    .top-offer {
      background: linear-gradient(90deg, #f59e0b, #d97706);
      color: #0f172a;
      text-align: center;
      padding: 8px;
      font-weight: 800;
      font-size: 0.85rem;
    }

    /* HEADER Y MENÚ */
    header {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 18px 5%;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo span { color: var(--primary); transition: color 1.2s; }

    .nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--glow);
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    /* BANNER DE IDIOMA CON BANDERA */
    .banner-idioma {
      background-size: cover;
      background-position: center;
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      transition: all 1s ease;
    }
    .banner-idioma::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(4, 13, 28, 0.82);
      z-index: 1;
    }
    .banner-idioma > * { position: relative; z-index: 2; }
    .banner-idioma h1 { font-size: 2.2rem; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .banner-idioma p { color: #cbd5e1; font-size: 1.05rem; }

    /* SELECTOR DE IDIOMAS (PESTAÑAS) */
    .idiomas-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background-size: cover;
      background-position: center;
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      transition: all 0.3s;
    }
    .tab-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }
    .tab-btn span { position: relative; z-index: 2; }
    .tab-btn.active {
      border-color: #ffffff;
      box-shadow: 0 0 20px var(--glow);
      transform: scale(1.03);
    }
    .tab-btn.active::before { background: rgba(0, 0, 0, 0.2); }

    /* TARJETAS DE NIVELES */
    .grid-niveles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card-nivel {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      transition: transform 0.3s, border-color 0.3s;
    }
    .card-nivel:hover { transform: translateY(-5px); border-color: var(--primary); }

    .price {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      margin: 12px 0;
      transition: color 1s;
    }

    .btn-accion {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      transition: opacity 0.2s, background 1s;
    }
    .btn-accion:hover { opacity: 0.9; }

    /* MODALES GENERALES */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9500;
      padding: 20px;
    }

    .modal-box {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 30px;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .modal-box input, .modal-box select {
      width: 100%;
      padding: 12px;
      margin: 10px 0 16px 0;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      text-align: center;
    }

    .btn-cerrar {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="top-offer">🔥 OFERTA ESPECIAL: 30 minutos de Clase GRATIS en tu primer acceso</div>

  <header>
    <div class="nav-container">
      <div class="logo">🎓 Liroy <span>Estudio</span></div>
      <div class="nav-links">
        <button class="nav-btn active" onclick="cambiarSeccion('cursos')">📚 Cursos</button>
        <button class="nav-btn" onclick="cambiarSeccion('perfil')">👤 Mi Perfil (Rol)</button>
        <button class="nav-btn" onclick="cambiarSeccion('personalizadas')">⚙️ Clases Personalizadas</button>
        <button class="nav-btn" onclick="abrirOwnerLogin()" style="background:#b91c1c; border-color:#dc2626;">🔑 Owner</button>
      </div>
    </div>
  </header>

  <div class="container" id="app-container">
    <!-- El contenido cambia dinámicamente -->
  </div>

  <!-- MODAL CONTRASEÑA DE ACCESO AL IDIOMA -->
  <div id="password-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="color:#38bdf8; margin-bottom:10px;" id="pass-modal-title">🔐 Acceso Protegido</h3>
      <p style="font-size:0.85rem; color:#94a3b8; margin-bottom:15px;">Ingresa la contraseña para entrar a este portal:</p>
      <input type="password" id="idioma-pass" placeholder="••••••••">
      <button class="btn-accion" onclick="verificarPasswordIdioma()">Entrar al Portal</button>
      <button class="btn-cerrar" onclick="cerrarModals()">Cancelar</button>
    </div>
  </div>

  <!-- MODAL LOGIN OWNER -->
  <div id="owner-login-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="color:#38bdf8; margin-bottom:10px;">🔐 Panel de Control Owner</h3>
      <input type="password" id="owner-pass" placeholder="Contraseña Maestra (liroy2026)">
      <button class="btn-accion" onclick="verificarOwner()">Acceder al Panel</button>
      <button class="btn-cerrar" onclick="cerrarModals()">Cancelar</button>
    </div>
  </div>

  <script>
    const nivelesBase = [
      { title: 'Kids (Menores de 8 años)', price: '$18 / mes', desc: 'Aprendizaje visual, dinámico y juegos interactivos.' },
      { title: 'Básico (A1 - A2)', price: '$25 / mes', desc: 'Bases gramaticales sólidas y conversación guiada.' },
      { title: 'Intermedio (B1 - B2)', price: '$35 / mes', desc: 'Fluidez intermedia, modismos y comprensión real.' },
      { title: 'Avanzado (C1 - C2)', price: '$45 / mes', desc: 'Dominio total, fonética avanzada y certificación.' }
    ];

    let idiomas = [
      { 
        id: 'en', name: 'Inglés', flag: 'https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg', 
        pass: 'ingles2026', bgDark: '#071936', gradient: 'radial-gradient(circle at top right, #0e2d5c, #040d1c)', primary: '#d91e36', glow: 'rgba(217, 30, 54, 0.45)', levels: nivelesBase 
      },
      { 
        id: 'pt', name: 'Portugués', flag: 'https://upload.wikimedia.org/wikipedia/commons/0/05/Flag_of_Brazil.svg', 
        pass: 'portugues2026', bgDark: '#032b16', gradient: 'radial-gradient(circle at top right, #064e28, #02170c)', primary: '#eab308', glow: 'rgba(234, 179, 8, 0.45)', levels: nivelesBase 
      },
      { 
        id: 'fr', name: 'Francés', flag: 'https://upload.wikimedia.org/wikipedia/en/c/c3/Flag_of_France.svg', 
        pass: 'frances2026', bgDark: '#081436', gradient: 'radial-gradient(circle at top right, #112663, #04091a)', primary: '#ef4444', glow: 'rgba(239, 68, 68, 0.45)', levels: nivelesBase 
      }
    ];

    let idiomaActual = 'en';
    let idiomaIntentado = null;
    let seccionActual = 'cursos';

    // Estado del estudiante actual (Simulado, controlado por el Owner)
    let estudiantePerfil = JSON.parse(localStorage.getItem('liroy_estudiante_perfil')) || {
      nombre: 'Sebastián (Estudiante)',
      idiomaActivo: 'Inglés (USA)'
    };

    function cambiarSeccion(seccion) {
      seccionActual = seccion;
      renderApp();
    }

    function seleccionarIdioma(id) {
      idiomaIntentado = id;
      const idiObj = idiomas.find(i => i.id === id);
      document.getElementById('pass-modal-title').textContent = `🔐 Contraseña para Portal ${idiObj.name}`;
      document.getElementById('idioma-pass').value = '';
      document.getElementById('password-modal').style.display = 'flex';
    }

    function verificarPasswordIdioma() {
      const passIngresada = document.getElementById('idioma-pass').value;
      const idiObj = idiomas.find(i => i.id === idiomaIntentado);

      if (passIngresada === idiObj.pass) {
        cerrarModals();
        idiomaActual = idiomaIntentado;
        
        // Aplicar colores y bandera del idioma seleccionado
        document.documentElement.style.setProperty('--bg-dark', idiObj.bgDark);
        document.documentElement.style.setProperty('--bg-gradient', idiObj.gradient);
        document.documentElement.style.setProperty('--primary', idiObj.primary);
        document.documentElement.style.setProperty('--glow', idiObj.glow);

        renderApp();
      } else {
        alert('❌ Contraseña incorrecta para este idioma.');
      }
    }

    function cerrarModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
    }

    function renderApp() {
      const container = document.getElementById('app-container');
      container.innerHTML = '';

      if (seccionActual === 'cursos') {
        const idiObj = idiomas.find(i => i.id === idiomaActual);

        let html = `
          <div class="idiomas-tabs">
        `;
        idiomas.forEach(i => {
          html += `
            <button class="tab-btn ${i.id === idiomaActual ? 'active' : ''}" style="background-image: url('${i.flag}')" onclick="seleccionarIdioma('${i.id}')">
              <span>${i.name}</span>
            </button>
          `;
        });
        html += `</div>`;

        html += `
          <div class="banner-idioma" style="background-image: url('${idiObj.flag}')">
            <h1>Portal Oficial de ${idiObj.name}</h1>
            <p>Selecciona tu nivel y comienza tu formación profesional en Liroy Estudio.</p>
          </div>
          <div class="grid-niveles">
        `;

        idiObj.levels.forEach(lvl => {
          html += `
            <div class="card-nivel">
              <div>
                <h3>${lvl.title}</h3>
                <div class="price">${lvl.price}</div>
                <p style="font-size:0.9rem; color:#cbd5e1;">${lvl.desc}</p>
              </div>
              <button class="btn-accion" onclick="alert('Inscribiendo en ${idiObj.name} - ${lvl.title}')">Inscribirme</button>
            </div>
          `;
        });

        html += `</div>`;
        container.innerHTML = html;

      } else if (seccionActual === 'perfil') {
        container.innerHTML = `
          <div style="background:var(--card-bg); padding:35px; border-radius:20px; border:1px solid rgba(255,255,255,0.1); max-width:600px; margin:0 auto; text-align:center;">
            <h2 style="margin-bottom:15px; color:#38bdf8;">👤 Perfil del Estudiante</h2>
            <div style="font-size:4rem; margin-bottom:15px;">🎓</div>
            <p style="font-size:1.2rem; font-weight:700; margin-bottom:8px;">${estudiantePerfil.nombre}</p>
            <p style="color:#94a3b8; margin-bottom:25px;">Estado: Activo en la Academia</p>
            
            <div style="background:rgba(0,0,0,0.3); padding:20px; border-radius:12px; border-left:4px solid var(--primary);">
              <p style="font-size:0.9rem; color:#cbd5e1;">Idioma que estás cursando actualmente:</p>
              <h3 style="font-size:1.5rem; margin-top:5px; color:#f8fafc;">⭐ ${estudiantePerfil.idiomaActivo}</h3>
            </div>
            <p style="font-size:0.75rem; color:#64748b; margin-top:15px;">* Este rol y asignación de idioma es controlado directamente por el Owner desde su panel privado.</p>
          </div>
        `;
      } else if (seccionActual === 'personalizadas') {
        container.innerHTML = `
          <div style="background:var(--card-bg); padding:35px; border-radius:20px; border:1px solid rgba(255,255,255,0.1); max-width:600px; margin:0 auto; text-align:center;">
            <h2 style="margin-bottom:15px; color:#38bdf8;">⚙️ Clases Personalizadas a Medida</h2>
            <p style="color:#cbd5e1; margin-bottom:20px;">Configura tus horarios, días y cantidad de personas para recibir tu tarifa estimada y enviarla a WhatsApp.</p>
            <button class="btn-accion" onclick="alert('Abriendo formulario de Clases Personalizadas...')">Configurar Mis Clases</button>
          </div>
        `;
      }
    }

    // Funciones del Owner para gestionar roles de estudiantes
    function abrirOwnerLogin() {
      document.getElementById('owner-login-modal').style.display = 'flex';
    }

    function verificarOwner() {
      const pass = document.getElementById('owner-pass').value;
      if (pass === 'liroy2026') {
        cerrarModals();
        const nuevoIdioma = prompt('Panel Owner: Asigna el idioma activo para el estudiante (Ej: Inglés, Portugués, Francés):', estudiantePerfil.idiomaActivo);
        if (nuevoIdioma) {
          estudiantePerfil.idiomaActivo = nuevoIdioma;
          localStorage.setItem('liroy_estudiante_perfil', JSON.stringify(estudiantePerfil));
          alert(`✅ Rol actualizado con éxito. Ahora el estudiante cursa: ${nuevoIdioma}`);
          if (seccionActual === 'perfil') renderApp();
        }
      } else {
        alert('❌ Contraseña de Owner incorrecta.');
      }
    }

    // Arrancar la app en cursos
    renderApp();
  </script>
</body>
</html>
